name: Build and publish APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/birthday-reminder-release.jks"

      - name: Verify tag matches app version
        run: |
          APP_VERSION="$(./gradlew -q printVersionName)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$APP_VERSION" = "$TAG_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION"
            exit 1
          }

      - name: Test and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/birthday-reminder-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease

      - name: Name APK
        run: mv app/build/outputs/apk/release/app-release.apk "birthday-reminder-${GITHUB_REF_NAME#v}.apk"

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: birthday-reminder-${{ github.ref_name }}
          path: birthday-reminder-*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" birthday-reminder-*.apk --verify-tag --generate-notes --title "生日管家 ${GITHUB_REF_NAME#v}"
